<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Vehicle</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/adminAddVeh.css">
</head>
<body>
    <h1>Add Vehicle</h1>
    <form id="addVehicleForm">
        <div>
            <label for="category">Category</label>
            <select id="category" required>
                <option value="">Select Category</option>
                <option value="Car">Car</option>
                <option value="Bike">Bike</option>
            </select>
        </div>
        <br>
        <div>
            <label for="brand">Brand</label>
            <input type="text" id="brand" required>
        </div>
        <br>
        <div>
            <label for="model">Model</label>
            <input type="text" id="model" required>
        </div>
        <br>
        <div>
            <label for="price">Price</label>
            <input type="number" id="price" required>
        </div>
        <br>
        <div>
            <label for="year">Year</label>
            <input type="number" id="year" required>
        </div>
        <br>
        <div>
            <label for="kmDriven">Kilometres</label>
            <input type="number" id="kmDriven" required>
        </div>
        <br>
        <div>
            <label for="description">Description</label>
            <br>
            <textarea id="description"></textarea>
        </div>
        <br>
        <div>
            <label for="images">Vehicle Images</label>
            <br>
            <input type="file" id="images" multiple accept="image/*" required>
        </div>
        <br>
        <button type="submit">Add Vehicle</button>
        <button type="button" onclick="goBack()">Cancel</button>
    </form>
    <script src="js/adminAddVeh.js"></script>

</body>

</html>
